# DigitalOcean App Platform spec. Deploy: doctl apps create --spec .do/app.yaml
# Gemma runs on a separate GPU Droplet (1-Click Ollama); point OLLAMA_URL at it.
name: dharohar
services:
  - name: agent
    github:
      repo: Prekshabarjatya/dharohar-agent
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    envs:
      - key: OLLAMA_URL
        value: http://YOUR_DROPLET_IP:11434/api
      - key: OLLAMA_MODEL
        value: gemma3:4b
      - key: SERPAPI_KEY
        type: SECRET
      - key: ELEVENLABS_API_KEY
        type: SECRET
      - key: SENTRY_DSN
        type: SECRET
      - key: ALLOWED_ORIGINS
        value: https://dharohar-a03.pages.dev
