<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<title>Dharohar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
<style>
/* Black and white only. Weight and space carry hierarchy, not colour. */
:root{--paper:#ffffff;--paper2:#f2f2f2;--ink:#000000;--ink2:#6b6b6b;--rule:#e3e3e3;--sindoor:#000000;--indigo:#000000;--ok:#000000;
  --serif:'Fraunces',Georgia,serif;--sans:system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#000000;--paper2:#161616;--ink:#ffffff;--ink2:#8f8f8f;--rule:#262626;--sindoor:#ffffff;--indigo:#ffffff;--ok:#ffffff}}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main,.screen{padding:28px clamp(20px,5vw,72px) 120px}
.mark{display:flex;align-items:baseline;gap:10px}
.mark b{font:650 2.1rem/1 var(--serif);letter-spacing:-.01em}
.mark span{font:600 .72rem var(--sans);letter-spacing:.24em;color:var(--ink2)}
.tag{color:var(--ink2);margin:8px 0 22px}
h2{font:650 1.25rem var(--serif)}
.eyebrow{font:700 .7rem var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
.mut{color:var(--ink2);font-size:.9rem}
button{font:600 1rem var(--sans);cursor:pointer;min-height:48px;border-radius:10px;color:inherit}
.primary{width:100%;border:0;background:var(--sindoor);color:#fff;padding:14px 18px;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:10px}
@media (prefers-color-scheme:dark){.primary{color:#000}}
.primary:disabled{background:var(--paper2);color:var(--ink2);cursor:default}
.ghost{background:transparent;border:1px solid var(--rule);padding:10px 16px}
.any{display:flex;gap:8px;margin:10px 0 0;max-width:640px}
#near{max-width:640px}
.prefs-wrap{max-width:640px}
input,select{font:inherit;color:var(--ink);background:var(--paper2);border:1px solid transparent;border-radius:10px;padding:12px 14px;min-height:48px;width:100%}
.any input{flex:1;min-width:0}.any button{flex:none}
.prefs-wrap{margin-top:14px}.prefs-wrap summary{cursor:pointer;color:var(--ink2);font-size:.88rem;list-style:none;min-height:32px;display:inline-flex;align-items:center}.prefs-wrap summary::after{content:'\00a0+'}.prefs-wrap[open] summary::after{content:'\00a0–'}
.prefs{display:flex;gap:8px;margin-top:6px}
.prefs label{flex:1;display:flex;flex-direction:column;gap:4px}
.prefs select{padding:10px 12px;font-size:.95rem}
.err{color:var(--ink);min-height:1.4em;font-size:.92rem;margin-top:10px}
.err .ghost{min-height:36px;padding:6px 12px;margin-left:6px;font-size:.85rem}
.sec{margin-top:30px}
.sec h2{margin:4px 0 6px}
/* city list: rows on hairlines, not cards */
.cities{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));column-gap:40px;border-top:1px solid var(--rule)}
.city{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;width:100%;padding:13px 2px;border-bottom:1px solid var(--rule)}
.city b{font:500 1.15rem var(--serif)}
.city small{grid-column:1;font-size:.85rem;color:var(--ink2)}
.city em{grid-row:1/3;grid-column:2;font:600 .75rem var(--sans);font-style:normal;color:var(--ink2);text-align:right}
.city em.inst{color:var(--ink)}
.city:hover b,.city:focus-visible b{color:var(--sindoor)}
button:focus-visible,select:focus-visible,input:focus-visible,.city:focus-visible{outline:2px solid var(--sindoor);outline-offset:2px}
/* plan: the route as a walking trail */
.back{border:0;background:none;padding:0;min-height:40px;color:var(--ink2);font-weight:500}
#ptitle{font:650 1.8rem/1.15 var(--serif);margin-top:10px}
.stops{list-style:none;padding:0;margin:22px 0 8px;max-width:760px}
.stops li{position:relative;display:grid;grid-template-columns:34px 1fr auto;gap:12px;padding-bottom:22px}
.stops li:not(:last-child)::before{content:'';position:absolute;left:16px;top:32px;bottom:2px;border-left:2px dotted var(--rule)}
.n{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:600 .9rem var(--serif);background:var(--paper)}
.stops b{font:500 1.08rem var(--serif);display:block}
.st{font:600 .75rem var(--sans);white-space:nowrap;padding-top:6px}
.st.ready{color:var(--ink)}.st.wait,.st.busy{color:var(--ink2)}.st.text{color:var(--ink)}
.dots::after{content:'';animation:d 1.2s steps(4) infinite}@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 20px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%)}
.dock{padding-left:clamp(20px,5vw,72px);padding-right:clamp(20px,5vw,72px)}
#pstatus{text-align:center;margin-bottom:8px;font-size:.85rem}
/* walk: black, nothing to look at */
#walk{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;background:#000;color:#fff}
#msg{font:500 1.6rem/1.3 var(--serif);max-width:20ch}
#play{display:none;width:190px;height:190px;border-radius:50%;border:1.5px solid #fff;background:transparent;color:#fff;font:600 1rem var(--sans);letter-spacing:.2em;animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px #ffffff12}}
@media (prefers-reduced-motion:reduce){#play{animation:none}.dots::after{animation:none;content:'…'}}
.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;opacity:.45;font:600 .75rem var(--sans);letter-spacing:.08em}
.top button{background:none;border:1px solid currentColor;border-radius:8px;padding:6px 12px;min-height:34px;font:600 .75rem var(--sans);letter-spacing:.1em}
#next{position:fixed;bottom:max(96px,13%);left:20px;right:20px;opacity:.55;font:400 1rem/1.45 var(--sans)}
#here{position:fixed;bottom:max(26px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);opacity:.4;background:none;border:1px solid #fff;padding:8px 18px;min-height:40px;font:600 .8rem var(--sans);letter-spacing:.08em;display:none}
#here:focus,#here:hover{opacity:1}
</style>
</head>
<body>
<main id="home">
  <div class="mark"><b>धरोहर</b><span>DHAROHAR</span></div>
  <p class="tag">Heritage walks you listen to, phone in pocket.</p>
  <button id="near" class="primary" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Walk where I am</button>
  <form id="any" class="any"><input id="q" placeholder="Search a place" aria-label="Search a place" required><button class="ghost">Go</button></form>
  <details class="prefs-wrap"><summary>Voice &amp; language</summary>
  <div class="prefs">
    <label><span class="eyebrow">Voice</span><select id="voice"><option value="rachel">Rachel · calm</option><option value="adam">Adam · deep</option><option value="domi">Domi · bright</option><option value="antoni">Antoni · warm</option></select></label>
    <label><span class="eyebrow">Language</span><select id="lang"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option><option value="gu">ગુજરાતી</option><option value="bn">বাংলা</option><option value="pa">ਪੰਜਾਬੀ</option><option value="ta">தமிழ்</option><option value="te">తెలుగు</option><option value="kn">ಕನ್ನಡ</option><option value="ml">മലയാളം</option></select></label>
  </div></details>
  <div id="err" class="err" role="alert"></div>
  <section class="sec" aria-labelledby="ch">
    <div class="eyebrow">Explore</div>
    <h2 id="ch">Heritage cities</h2>
    <ul id="cities" class="cities"></ul>
  </section>
</main>

<section id="plan" class="screen" hidden>
  <button id="back" class="back" type="button">← All walks</button>
  <h2 id="ptitle"></h2>
  <p id="pmeta" class="mut"></p>
  <ol id="stops" class="stops"></ol>
  <div class="dock"><div><p id="pstatus" class="mut" aria-live="polite"></p><button id="start" class="primary" disabled>Start walk</button></div></div>
</section>

<div id="walk" role="main" aria-live="polite">
  <div class="top"><span id="count"></span><button id="exit">EXIT</button></div>
  <p id="msg"></p>
  <button id="play">PLAY</button>
  <p id="next"></p>
  <button id="here" type="button">I'm here</button>
</div>

<script type="module">
import { WALKS, CITIES, dist, bearingWord, reachedWaypoint, placeToPoint, nearbyWalk } from '/walk-core.js';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const store = (k, v) => { try { v === undefined ? (v = localStorage[k]) : (localStorage[k] = v) } catch {} return v; };
$('voice').value = store('dh_voice') || 'rachel'; $('voice').onchange = () => { store('dh_voice', $('voice').value); renderCities(myPos); };
$('lang').value = store('dh_lang') || 'en'; $('lang').onchange = () => { store('dh_lang', $('lang').value); renderCities(myPos); };

const audio = new Audio();
let walk = null, tours = [], played = new Set(), watchId = null, wake = null, lastPos = null, playing = false, cur = -1, waiting = -1;

// ---------- home ----------
let myPos = null;
function renderCities(me) {
  myPos = me;
  const list = me ? [...CITIES].sort((a, b) => dist(me, a) - dist(me, b)) : CITIES;
  $('cities').innerHTML = list.map(c => {
    const km = me ? Math.round(dist(me, c) / 1000) : null;
    const instant = c.walk && $('voice').value === 'rachel' && $('lang').value === 'en'; // pre-made audio is English, Rachel
    const right = instant ? '<em class="inst">Instant</em>' : km !== null ? `<em>${km < 30 ? 'Near you' : km + ' km'}</em>` : '<em></em>';
    return `<li><button class="city" data-city="${esc(c.name)}"><b>${esc(c.name)}</b>${right}<small>${esc(c.anchor)}${instant && km !== null ? ` · ${km < 30 ? 'near you' : km + ' km'}` : ''}</small></button></li>`;
  }).join('');
  document.querySelectorAll('.city').forEach(b => b.onclick = () => openCity(CITIES.find(c => c.name === b.dataset.city)));
}
renderCities(null);
// Sort cities nearest-first only if location is already allowed; never prompt on page load.
navigator.permissions?.query({ name: 'geolocation' }).then(p => {
  if (p.state === 'granted') navigator.geolocation.getCurrentPosition(x => renderCities({ lat: x.coords.latitude, lng: x.coords.longitude }), () => {}, { maximumAge: 600000, timeout: 8000 });
}).catch(() => {});

const inApp = /LinkedInApp|Instagram|FBAN|FBAV|Line\/|Snapchat|Twitter/i.test(navigator.userAgent);
function showErr(html) { $('err').innerHTML = html; }
function locationError(e) {
  const tip = inApp ? ' This in-app browser often can\'t share location: open the link in Chrome or Safari.' : '';
  const msg = e.code === 1 ? 'Location permission is off for this site. Allow it in your browser\'s site settings, or pick a city below.'
    : e.code === 2 ? 'Couldn\'t find your location. Is GPS / Location turned on?'
    : 'Finding your location took too long.';
  showErr(`${esc(msg + tip)} <button class="ghost" id="retry" type="button">Try again</button>`);
  $('retry').onclick = locate;
}
function locate() {
  if (!navigator.geolocation) return showErr('This browser can\'t share location. Pick a city below or type a place.');
  showErr('Finding you…');
  navigator.geolocation.getCurrentPosition(
    p => build(nearbyWalk({ lat: p.coords.latitude, lng: p.coords.longitude }, 'Walk where you are')),
    locationError, { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 });
}
$('near').onclick = locate;
$('any').onsubmit = e => { e.preventDefault(); showErr('Looking it up…'); build(placeToPoint($('q').value).then(pt => nearbyWalk(pt, pt.name))); };
function openCity(c) {
  if (c.walk) return plan(WALKS.find(w => w.slug === c.walk));
  showErr(`Finding heritage around ${esc(c.anchor)}…`);
  build(nearbyWalk({ lat: c.lat, lng: c.lng }, `${c.name}: around ${c.anchor}`));
}
async function build(p) {
  try { const w = await p; showErr(''); plan(w); }
  catch (e) { showErr(esc(e.message || 'Something went wrong. Check your connection and try again.')); }
}

// ---------- plan: show the route, prepare stops two at a time, start once stop 1 is ready ----------
let prepToken = 0;
async function plan(w) {
  walk = w; tours = w.waypoints.map(() => ({ status: 'wait' })); played = new Set(); cur = -1; waiting = -1;
  const token = ++prepToken, t0 = Date.now();
  show('plan');
  $('ptitle').textContent = w.name;
  const total = w.waypoints.reduce((s, p, i) => s + (i ? dist(w.waypoints[i - 1], p) : 0), 0);
  $('pmeta').textContent = `${w.waypoints.length} stops · about ${(total / 1000).toFixed(1)} km of walking`;
  renderStops(); ready();
  const voice = $('voice').value, lang = $('lang').value;
  // Ready-made walks ship with their audio (English, Rachel): instant, and they work offline.
  if (w.slug !== 'custom' && voice === 'rachel' && lang === 'en') {
    const pre = await fetch(`/premade/${w.slug}.json`).then(r => r.ok ? r.json() : null).catch(() => null);
    if (pre && token === prepToken) { pre.stops.forEach((s, i) => tours[i] = { status: 'ready', ...s }); pre.stops.forEach(s => fetch(s.audioUrl).catch(() => {})); renderStops(); return ready(); }
  }
  const tick = setInterval(() => token === prepToken ? status(t0) : clearInterval(tick), 1000);
  status(t0);
  let next = 0;
  const worker = async () => {
    while (next < w.waypoints.length && token === prepToken) {
      const i = next++;
      tours[i] = { status: 'busy' }; renderStops();
      const r = await fetch('/script', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ monument: w.waypoints[i].monument, voice, lang }) }).catch(() => null);
      if (token !== prepToken) return;
      const t = r?.ok ? await r.json().catch(() => null) : null;
      tours[i] = t ? { status: t.audioUrl ? 'ready' : 'text', ...t } : { status: 'text', script: `${w.waypoints[i].label}.` };
      if (t?.audioUrl) fetch(t.audioUrl).catch(() => {}); // cache it now, while there is signal
      renderStops(); ready();
      if (waiting === i) playStop(i); // the walker arrived before it was ready
    }
  };
  await Promise.all([worker(), worker()]);
  clearInterval(tick); if (token === prepToken) ready();
}
const done = t => t.status === 'ready' || t.status === 'text';
function renderStops() {
  $('stops').innerHTML = walk.waypoints.map((p, i) => {
    const m = i ? Math.round(dist(walk.waypoints[i - 1], p)) : null;
    const st = { ready: ['ready', 'Ready'], text: ['text', 'Text only'], busy: ['busy dots', 'Writing'], wait: ['wait', 'Queued'] }[tours[i].status];
    return `<li><span class="n">${i + 1}</span><div><b>${esc(p.label)}</b><div class="mut">${m === null ? 'Start here' : `${m < 1000 ? m + ' m' : (m / 1000).toFixed(1) + ' km'} from stop ${i}`}</div></div><span class="st ${st[0]}">${st[1]}</span></li>`;
  }).join('');
}
function status(t0) {
  const n = tours.filter(done).length, s = Math.round((Date.now() - t0) / 1000);
  if (n === tours.length) return;
  $('pstatus').textContent = `${n} of ${tours.length} stops ready · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}
function ready() {
  const ok = done(tours[0]);
  $('start').disabled = !ok;
  $('start').textContent = ok ? 'Start walk' : 'Writing the first stop…';
  if (tours.every(done)) $('pstatus').textContent = `All ${tours.length} stops ready · saved for offline`;
}
$('back').onclick = () => { prepToken++; show('home'); };
$('start').onclick = () => startWalk();

// ---------- walk ----------
async function startWalk() {
  show('walk'); $('play').style.display = 'none'; $('next').textContent = ''; $('here').style.display = 'none';
  $('count').textContent = walk.name;
  for (let n = 5; n > 0; n--) { if ($('walk').hidden) return; $('msg').textContent = `Put your phone in your pocket in ${n}…`; await new Promise(r => setTimeout(r, 1000)); }
  $('msg').textContent = ''; $('play').style.display = 'block';
  $('play').onclick = () => {
    $('play').style.display = 'none'; $('here').style.display = 'block';
    navigator.wakeLock?.request('screen').then(l => wake = l).catch(() => {}); // screen-off pauses GPS + audio
    playStop(0); track();
  };
}
function playStop(i) {
  if (played.has(i)) return;
  const t = tours[i];
  if (!done(t)) { waiting = i; $('next').textContent = `Getting ${walk.waypoints[i].label} ready…`; return; }
  waiting = -1; played.add(i); cur = i; playing = true;
  navigator.vibrate?.(200);
  $('count').textContent = `Stop ${i + 1} of ${walk.waypoints.length}`;
  $('next').textContent = `Now: ${walk.waypoints[i].label}`;
  if (t.audioUrl) { audio.src = t.audioUrl; audio.play().catch(() => speak(t.script, afterStop)); }
  else speak(t.script, afterStop);
}
audio.onended = () => afterStop();
function speak(text, onEnd) {
  if (!text) return onEnd?.();
  const u = new SpeechSynthesisUtterance(text); u.lang = ($('lang').value || 'en') + '-IN'; u.onend = onEnd;
  speechSynthesis.speak(u);
}
function afterStop() { // what next: direction + distance to the next stop, spoken and shown
  playing = false;
  const i = walk.waypoints.findIndex((_, k) => !played.has(k));
  if (i < 0) return finish();
  const from = lastPos || walk.waypoints[cur], to = walk.waypoints[i];
  const m = Math.round(dist(from, to) / 10) * 10;
  const line = `Next: ${to.label}, about ${m < 1000 ? m + ' metres' : (m / 1000).toFixed(1) + ' kilometres'} ${bearingWord(from, to)}.`;
  $('next').textContent = `${line} Keep walking; it plays when you arrive.`;
  if ($('lang').value === 'en') speak(line);
}
function finish() {
  $('count').textContent = 'Walk complete';
  $('next').textContent = ''; $('here').style.display = 'none';
  $('msg').innerHTML = `You visited ${played.size} place${played.size > 1 ? 's' : ''}. 🙏<br><button class="ghost" id="home2" style="margin-top:20px;color:#fff;border-color:#fff">Back to start</button>`;
  $('home2').onclick = () => { stop(); show('home'); };
  if ($('lang').value === 'en') speak('That was the last stop. Thank you for walking with Dharohar.');
}
// "I'm here": for weak GPS (or no location at all), play the next unvisited stop by hand.
$('here').onclick = () => { if (playing) return; const i = walk.waypoints.findIndex((_, k) => !played.has(k)); if (i >= 0) playStop(i); };
function track() {
  if (!navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(p => {
    lastPos = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (playing) return;
    const i = reachedWaypoint(lastPos, walk.waypoints, played);
    if (i >= 0) playStop(i);
  }, e => { if (e.code === 1) $('next').textContent = 'Location is off, so stops won\'t play by themselves. Tap "I\'m here" at each place.'; },
  { enableHighAccuracy: true, maximumAge: 5000 });
}
function stop() {
  audio.pause(); speechSynthesis.cancel(); playing = false; waiting = -1;
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null; wake?.release(); wake = null;
}
$('exit').onclick = () => { stop(); show('plan'); };

function show(screen) {
  $('home').hidden = screen !== 'home';
  $('plan').hidden = screen !== 'plan';
  $('walk').hidden = screen !== 'walk';
  $('walk').style.display = screen === 'walk' ? 'flex' : 'none';
  scrollTo(0, 0);
}
show('home');
navigator.serviceWorker?.register('/sw.js').catch(() => {});
</script>
</body>
</html>
